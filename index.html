<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول التاريخ الاحترافي</title>
    <!-- خطوط جوجل العصرية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- مكتبات التحويل -->
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-hijri@2.1.2/moment-hijri.min.js"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            gap: 24px;
            max-width: 1000px;
            width: 100%;
            flex-wrap: wrap;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        .main-panel {
            flex: 2;
            min-width: 340px;
        }

        .sidebar {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 4rem);
        }

        h2 {
            margin: 0 0 24px 0;
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 700;
        }

        h3 {
            margin: 0 0 16px 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .converter-section {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
            transition: transform 0.2s;
        }

        .converter-section:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }

        .inputs-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            direction: ltr;
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        input[type="number"] {
            width: 50px;
            padding: 8px;
            border: 1px solid transparent;
            background: #f1f5f9;
            border-radius: 6px;
            text-align: center;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            transition: all 0.2s;
        }

        input[type="number"].year {
            width: 70px;
        }

        input[type="number"]:focus {
            outline: none;
            background: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* إخفاء أسهم الأرقام الافتراضية للمتصفح */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .separator {
            color: var(--text-muted);
            font-weight: bold;
            font-size: 1.2rem;
        }

        button {
            font-family: 'Cairo', sans-serif;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
            transform: scale(1.02);
        }

        .result-box {
            margin-top: 16px;
            padding: 12px;
            background: #e0f2fe;
            border-radius: 8px;
            color: #0369a1;
            font-weight: 700;
            font-size: 1.2rem;
            direction: ltr;
            text-align: center;
            display: none;
            border: 1px dashed #7dd3fc;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .btn-danger {
            background: #fee2e2;
            color: var(--danger);
            padding: 6px 12px;
            font-size: 0.875rem;
        }

        .btn-danger:hover {
            background: var(--danger);
            color: white;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-list::-webkit-scrollbar {
            width: 6px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .history-item {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            direction: ltr;
            text-align: right;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
        }

        .history-item span.badge {
            background: var(--primary);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-family: 'Cairo', sans-serif;
        }

        /* استعلامات الوسائط للأجهزة المحمولة */
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .input-row { flex-direction: column; align-items: stretch; }
            button { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- القسم الرئيسي -->
        <div class="card main-panel">
            <h2>محول التاريخ</h2>

            <!-- هجري إلى ميلادي -->
            <div class="converter-section">
                <h3>من هجري إلى ميلادي</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: -10px;">النتيجة ستظهر بصيغة: MM/DD/YYYY</p>
                <div class="input-row">
                    <div class="inputs-wrapper">
                        <input type="number" id="h-d" placeholder="يوم" tabindex="1" max="30">
                        <span class="separator">/</span>
                        <input type="number" id="h-m" placeholder="شهر" tabindex="2" max="12">
                        <span class="separator">/</span>
                        <input type="number" id="h-y" class="year" placeholder="سنة" tabindex="3" max="1500">
                    </div>
                    <button onclick="hToG()" tabindex="4">تحويل التاريخ</button>
                </div>
                <div class="result-box" id="res-g"></div>
            </div>

            <!-- ميلادي إلى هجري -->
            <div class="converter-section" style="margin-bottom: 0;">
                <h3>من ميلادي إلى هجري</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: -10px;">أدخل التاريخ بصيغة: شهر / يوم / سنة (النظام الأمريكي)</p>
                <div class="input-row">
                    <div class="inputs-wrapper">
                        <input type="number" id="g-m" placeholder="شهر" tabindex="5" max="12">
                        <span class="separator">/</span>
                        <input type="number" id="g-d" placeholder="يوم" tabindex="6" max="31">
                        <span class="separator">/</span>
                        <input type="number" id="g-y" class="year" placeholder="سنة" tabindex="7" max="2100">
                    </div>
                    <button onclick="gToH()" tabindex="8">تحويل التاريخ</button>
                </div>
                <div class="result-box" id="res-h"></div>
            </div>
        </div>

        <!-- السجل الجانبي -->
        <div class="card sidebar">
            <div class="history-header">
                <h3>سجل التحويلات</h3>
                <button class="btn-danger" onclick="clearHistory()">مسح السجل</button>
            </div>
            <div class="history-list" id="history-list">
                <!-- يتم حقن السجل هنا -->
            </div>
        </div>
    </div>

    <script>
        const HISTORY_KEY = 'dateConversionHistoryPro';

        function saveHistory(type, from, to) {
            let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            const timestamp = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
            history.unshift({ type, from, to, time: timestamp });
            if (history.length > 20) history.pop();
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            if(history.length === 0) {
                list.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding: 2rem 0;">لا توجد تحويلات سابقة</div>';
                return;
            }
            list.innerHTML = history.map(item => `
                <div class="history-item">
                    <div>
                        <span style="color:var(--text-muted); font-size:0.8rem; margin-right:8px;">${item.time}</span>
                        ${item.from} ➔ <strong>${item.to}</strong>
                    </div>
                    <span class="badge">${item.type === 'H2G' ? 'هـ ← م' : 'م ← هـ'}</span>
                </div>
            `).join('');
        }

        function clearHistory() {
            localStorage.removeItem(HISTORY_KEY);
            renderHistory();
        }

        function displayResult(elementId, text) {
            const el = document.getElementById(elementId);
            el.innerText = text;
            el.style.display = 'block';
        }

        function hToG() {
            const d = document.getElementById('h-d').value;
            const m = document.getElementById('h-m').value;
            const y = document.getElementById('h-y').value;
            
            if (!d || !m || !y) return alert('يرجى تعبئة جميع الحقول');

            const mDate = moment(`${y}/${m}/${d}`, 'iYYYY/iM/iD');
            if (!mDate.isValid()) return alert('تاريخ هجري غير صحيح');

            const result = mDate.format('MM/DD/YYYY');
            displayResult('res-g', result);
            saveHistory('H2G', `${y}/${m}/${d}`, result);
        }

        function gToH() {
            const m = document.getElementById('g-m').value;
            const d = document.getElementById('g-d').value;
            const y = document.getElementById('g-y').value;
            
            if (!d || !m || !y) return alert('يرجى تعبئة جميع الحقول');

            const mDate = moment(`${m}/${d}/${y}`, 'M/D/YYYY');
            if (!mDate.isValid()) return alert('تاريخ ميلادي غير صحيح');

            const result = mDate.format('iYYYY/iMM/iDD');
            displayResult('res-h', result);
            saveHistory('G2H', `${m}/${d}/${y}`, result);
        }

        // الانتقال للخانة التالية تلقائياً
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', function() {
                const maxLen = this.classList.contains('year') ? 4 : 2;
                if (this.value.length >= maxLen) {
                    const currentTab = parseInt(this.getAttribute('tabindex'));
                    const nextEl = document.querySelector(`[tabindex="${currentTab + 1}"]`);
                    if (nextEl) nextEl.focus();
                }
            });
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    if (this.id.startsWith('h-')) hToG();
                    if (this.id.startsWith('g-')) gToH();
                }
            });
        });

        renderHistory();
    </script>
</body>
</html>
